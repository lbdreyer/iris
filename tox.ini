[tox] ; core settings, affect all test envs/ config how tox is invoked
requires =
    tox-conda

[testenv:py{38,39,310}-{linux}-test]
description =
    Perform iris system, integration and unit tests.
conda_spec = # TODO: in top level?
    py38-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py38-linux-64.lock
    py39-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py39-linux-64.lock
    py310-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py310-linux-64.lock
usedevelop =
    true
commands =
    python -m iris.tests.runner {posargs}

[testenv:doc-{tests,linkcheck}]
description =
    Build, test and link-check the Iris documentation.
allowlist_externals =
    make
conda_spec =
    {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py310-linux-64.lock
usedevelop =
    true
changedir =
    {toxinidir}{/}docs
commands =
     make clean html
     tests: make doctest
     linkcheck: make linkcheck

[testenv:py{38,39,310}-{linux}-wheel]
description =
    Perform iris local wheel install and import test.
conda_spec = # TODO: in top level?
    py38-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py38-linux-64.lock
    py39-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py39-linux-64.lock
    py310-linux: {toxinidir}{/}requirements{/}ci{/}nox.lock{/}py310-linux-64.lock
usedevelop =
    true
changedir =
    {toxinidir}{/}dist
#

